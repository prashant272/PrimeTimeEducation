<!doctype html>
<html lang="en">

<head>
  <!-- Basic -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Page Title (SEO Optimized) -->
  <title>
    Education Awards | Global Education Excellence Awards by Prime Time Research Media
  </title>

  <!-- Primary SEO -->
  <meta name="description"
    content="Global Education Excellence Awards by Prime Time Research Media recognizes outstanding schools, universities, educators, and academic leaders. Join the most prestigious education awards ceremony." />
  <meta name="keywords"
    content="Prime Time Education Awards, Global Education Awards, Prime Time Research Media, Education Excellence Awards 2026, School Awards India, Global Academic Awards, Teacher Recognition Awards, Prime Time Awards, Education Leadership Awards" />
  <meta name="robots" content="index, follow" />

  <!-- Open Graph (Facebook / LinkedIn) -->
  <meta property="og:title" content="Education Awards | Global Education Excellence Awards" />
  <meta property="og:description"
    content="Celebrating excellence, leadership, and pedagogical innovation in the global education sector." />
  <meta property="og:type" content="website" />
  <meta property="og:url" id="og-url" content="https://globaleducationawards.com" />
  <meta property="og:image" content="/og-image.jpg" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Education Awards | Global Education Excellence Awards" />
  <meta name="twitter:description"
    content="Recognizing academic leaders and institutions through Global Education Excellence Awards." />
  <meta name="twitter:image" content="/og-image.jpg" />

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="/logo.png" />

  <!-- Canonical -->
  <link rel="canonical" id="canonical-link" href="https://globaleducationawards.com" />

  <script>
    // Dynamic SEO update for Main Domain and Subdomain
    (function () {
      const currentUrl = window.location.protocol + "//" + window.location.hostname + window.location.pathname;
      document.getElementById('canonical-link').setAttribute('href', currentUrl);
      document.getElementById('og-url').setAttribute('content', currentUrl);
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
