<!doctype html>
<html lang="en">
  <head>
    <!-- Basic -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Page Title (SEO Optimized for BOTH Keywords) -->
    <title>
      Healthcare Awards | Global Healthcare Awards by Prime Time Research Media
    </title>

    <!-- Primary SEO -->
    <meta
      name="description"
      content="Healthcare Awards and Global Healthcare Awards by Prime Time Research Media recognize excellence, innovation, hospitals, doctors, and healthcare leaders worldwide."
    />
    <meta
      name="keywords"
      content="Healthcare Awards, Global Healthcare Awards, Medical Excellence Awards, Hospital Awards, Doctor Awards, Prime Time Research Media"
    />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph (Facebook / LinkedIn) -->
    <meta
      property="og:title"
      content="Healthcare Awards | Global Healthcare Awards by Prime Time Research Media"
    />
    <meta
      property="og:description"
      content="Global Healthcare Awards and Healthcare Awards celebrating excellence, leadership, and innovation in the healthcare industry worldwide."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://globalhealthcareawards.com" />
    <meta property="og:image" content="/og-image.jpg" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Healthcare Awards | Global Healthcare Awards"
    />
    <meta
      name="twitter:description"
      content="Recognizing hospitals, doctors, and healthcare leaders through Global Healthcare Awards."
    />
    <meta name="twitter:image" content="/og-image.jpg" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/logo.png" />

    <!-- Canonical -->
    <link rel="canonical" href="https://globalhealthcareawards.com" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
