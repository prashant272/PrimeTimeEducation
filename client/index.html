<!doctype html>
<html lang="en">

<head>
  <!-- Basic -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Page Title (SEO Optimized) -->
  <title>
    Education Awards | Global Education Excellence Awards | Prime Time Research Media
  </title>

  <!-- Primary SEO -->
  <meta name="description"
    content="Education Awards - Global Education Excellence Awards by Prime Time Research Media recognizes excellence in schools, universities, and educators globally. Apply for the most prestigious awards in the education sector." />
  <meta name="keywords"
    content="Education Awards, Global Education Excellence Awards, Best Education Awards, Top Education Awards, Academic Excellence Awards, Prime Time Education Awards, Education Leadership Awards, School Awards, Teacher Awards, Prime Time Research Media, International Education Awards, Education Recognition 2026" />
  <meta name="robots" content="index, follow" />

  <!-- Open Graph (Facebook / LinkedIn) -->
  <meta property="og:title" content="Education Awards | Global Education Excellence Awards" />
  <meta property="og:description"
    content="The most prestigious Education Awards of 2026. Celebrating excellence in schools, teachers, and academic institutions worldwide." />
  <meta property="og:type" content="website" />
  <meta property="og:url" id="og-url" content="https://globaleducationawards.in" />
  <meta property="og:image" content="/og-image.jpg" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Education Awards | Top Global Education Recognition" />
  <meta name="twitter:description"
    content="Nominate for the Global Education Excellence Awards. Recognizing leadership and innovation in the education sector." />
  <meta name="twitter:image" content="/og-image.jpg" />

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="/logo.png" />

  <!-- Canonical -->
  <link rel="canonical" id="canonical-link" href="https://globaleducationawards.in" />

  <script>
    // Dynamic SEO update for Main Domain and Subdomain
    (function () {
      const currentUrl = window.location.protocol + "//" + window.location.hostname + window.location.pathname;
      document.getElementById('canonical-link').setAttribute('href', currentUrl);
      document.getElementById('og-url').setAttribute('content', currentUrl);
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
