<!doctype html>
<html lang="en">

<head>
  <!-- Basic -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Page Title (SEO Optimized) -->
  <title>
    Global Education Excellence Awards 2026 | Indian Education Awards | Prime Time Research Media
  </title>

  <!-- Primary SEO -->
  <meta name="description"
    content="Nominate for the Global Education Excellence Awards 2026 & Indian Education Awards by Prime Time Research Media. Recognizing excellence in schools, colleges, and educators worldwide." />
  <meta name="keywords"
    content="Global Education Excellence Awards, Education Awards, Indian Education Awards, Best Education Awards 2026, Top Education Awards India, Academic Excellence Awards, Prime Time Education Awards, Education Leadership Awards, School Awards, Teacher Awards, International Education Awards, Prime Time Research Media" />
  <meta name="robots" content="index, follow" />

  <!-- Open Graph (Facebook / LinkedIn) -->
  <meta property="og:title" content="Global Education Excellence Awards 2026 | Indian Education Awards" />
  <meta property="og:description"
    content="Celebrating global excellence in education. Join the most prestigious awards for schools, teachers, and academic institutions worldwide." />
  <meta property="og:type" content="website" />
  <meta property="og:url" id="og-url" content="https://globaleducationawards.in" />
  <meta property="og:image" content="/og-image.jpg" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Global Education Excellence Awards 2026 | Top Recognition" />
  <meta name="twitter:description"
    content="Nominate for the Global Education Excellence Awards. Celebrating leadership and innovation in the education sector globally." />
  <meta name="twitter:image" content="/og-image.jpg" />

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="/logo.png" />

  <!-- Canonical -->
  <link rel="canonical" id="canonical-link" href="https://globaleducationawards.in" />

  <script>
    // Dynamic SEO update for Main Domain and Subdomain
    (function () {
      const currentUrl = window.location.protocol + "//" + window.location.hostname + window.location.pathname;
      document.getElementById('canonical-link').setAttribute('href', currentUrl);
      document.getElementById('og-url').setAttribute('content', currentUrl);
    })();
  </script>

  <!-- Structured Data (JSON-LD) for Google Knowledge Label -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Global Education Awards",
      "alternateName": ["Indian Education Awards", "Global Education Excellence Awards"],
      "url": "https://globaleducationawards.in",
      "logo": "https://globaleducationawards.in/logo.png",
      "description": "Recognizing excellence in the global education sector through the prestigious Global Education Excellence Awards and Indian Education Awards.",
      "contactPoint": {
        "@type": "ContactPoint",
        "telephone": "+91-9810882769",
        "contactType": "Nominations"
      },
      "sameAs": [
        "https://www.facebook.com/PrimeTimeResearchMedia",
        "https://www.linkedin.com/company/prime-time-research-media-pvt-ltd"
      ]
    }
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
