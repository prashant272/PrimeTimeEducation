<!doctype html>
<html lang="en">
  <head>
    <!-- ================= BASIC ================= -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ================= TITLE (CTR BOOSTER) ================= -->
    <title>
      Global Healthcare Excellence Awards 2026 | Prime Time Research Media
    </title>

    <!-- ================= PRIMARY SEO ================= -->
    <meta
      name="description"
      content="Global Healthcare Excellence Awards by Prime Time Research Media is a prestigious international healthcare awards platform recognizing hospitals, doctors, healthcare leaders, medical innovation, and excellence in patient care worldwide."
    />

    <meta
      name="keywords"
      content="Global Healthcare Excellence Awards, Healthcare Awards, Medical Awards, Hospital Awards, Doctor Awards, Healthcare Leadership Awards, Prime Time Research Media"
    />

    <meta name="robots" content="index, follow" />

    <!-- ================= CANONICAL ================= -->
    <link rel="canonical" href="https://globalhealthcareawards.com/" />

    <!-- ================= OPEN GRAPH ================= -->
    <meta
      property="og:title"
      content="Global Healthcare Excellence Awards 2026 | Prime Time Research Media"
    />
    <meta
      property="og:description"
      content="Recognizing excellence, innovation, hospitals, doctors, and healthcare leaders through Global Healthcare Excellence Awards worldwide."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://globalhealthcareawards.com/" />
    <meta property="og:image" content="/og-image.jpg" />

    <!-- ================= TWITTER CARD ================= -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Global Healthcare Excellence Awards 2026"
    />
    <meta
      name="twitter:description"
      content="Celebrating hospitals, doctors, and healthcare excellence globally."
    />
    <meta name="twitter:image" content="/og-image.jpg" />

    <!-- ================= FAVICON ================= -->
    <link rel="icon" type="image/png" href="/logo.png" />

    <!-- ================= SCHEMA (EXTRA BOOST) ================= -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Global Healthcare Excellence Awards",
        "url": "https://globalhealthcareawards.com",
        "logo": "https://globalhealthcareawards.com/logo.png",
        "description": "Global Healthcare Excellence Awards by Prime Time Research Media recognizes excellence in healthcare services, hospitals, doctors, leadership, and innovation worldwide.",
        "sameAs": [
          "https://www.linkedin.com",
          "https://www.facebook.com"
        ]
      }
    </script>
  </head>

  <body>
    <!-- ================= SEO CONTENT (VISIBLE TO GOOGLE) ================= -->
    <noscript>
      <h1>Global Healthcare Excellence Awards</h1>

      <p>
        The Global Healthcare Excellence Awards by Prime Time Research Media is a
        prestigious international healthcare recognition platform honoring
        hospitals, doctors, healthcare professionals, medical institutions, and
        healthcare leaders for excellence, innovation, and outstanding
        contribution to the global healthcare industry.
      </p>

      <h2>About Global Healthcare Excellence Awards</h2>

      <p>
        Global Healthcare Excellence Awards is committed to recognizing
        excellence in healthcare services, patient care, medical innovation,
        hospital management, and healthcare leadership across India, Asia,
        Middle East, Europe, and other regions worldwide.
      </p>

      <h2>Why Global Healthcare Excellence Awards Are Important</h2>

      <ul>
        <li>Recognizing top hospitals and medical institutions</li>
        <li>Awarding excellence among doctors and healthcare professionals</li>
        <li>Encouraging innovation in healthcare technology</li>
        <li>Promoting leadership and quality patient care</li>
      </ul>
    </noscript>

    <!-- ================= REACT ROOT ================= -->
    <div id="root"></div>

    <!-- ================= MAIN SCRIPT ================= -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
